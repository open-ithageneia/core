[project]
name = "open_ithageneia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"django-environ~=0.12.0",
	"django~=6.0.0",
	# No longer used by any model — migration 0001 imports
	# django_jsonform.models.fields.JSONField, so removing the package
	# breaks `migrate` on a fresh database. Drop it when 0001 is squashed.
	"django-jsonform~=2.23.0",
	"django-vite~=3.1.0",
	"inertia-django~=1.2.0",
	"django-allauth~=65.14.0",
	"django-import-export~=4.4.0",
	"tablib[xlsx]~=3.8.0",
	"gunicorn~=23.0.0",
	"pillow~=12.1.0",
	"djangorestframework>=3.16.1",
	"django-filter>=25.2",
]

[dependency-groups]
dev = [
	"ruff>=0.14.14,<0.15",
]

[tool.ruff.format]
indent-style = "tab"
# Migrations are generated by Django in its own style and are not edited
# afterwards. Reformatting them rewrites every applied migration in the
# tree for no benefit and buries real changes in whitespace.
exclude = ["*/migrations/*"]
